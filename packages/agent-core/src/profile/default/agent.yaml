name: agent
description: Default Ody Code agent

systemPromptPath: ./system.md
promptVars:
  roleAdditional: ''

tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
  - TaskList
  - TaskOutput
  - TaskStop
  - CronCreate
  - CronList
  - CronDelete
  - ReadMediaFile
  - TodoList
  - Skill
  - WebSearch
  - Agent
  - FetchURL
  - AskUserQuestion
  - EnterPlanMode
  - ExitPlanMode
  - EnterDesignMode
  - ExitDesignMode
  - ShowDesignMockup
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  - RunE2ETests
  - RequestCodeReview
  - ReviewTests
  - SaveIdeaReport
  # Office-hours session-mode tools. The host activates the mode (setSessionMode),
  # but the in-mode operations are model-driven, so the model must be able to see
  # them — otherwise the contract orders calls to tools that aren't in its tool set.
  - SetOfficeHoursLanguage
  - EnterOfficeHoursMode
  - ExitOfficeHoursMode
  - AppendBuilderProfile
  - AppendLearning
  - SearchLearnings
  - EnsureClaudeMdRouting
  - SyncOfficeHoursArtifact
  # Game-design session-mode tools (same rationale as office-hours).
  - SetGameDesignLanguage
  - EnterGameDesignMode
  - ExitGameDesignMode
  - AppendGameDesignProfile
  - AppendGameDesignLearning
  - SearchGameDesignLearnings
  - EnsureGameDesignRouting
  - SyncGameDesignArtifact
  - mcp__*

subagents:
  coder:
    description: Good at general software engineering tasks.
  explore:
    description: Fast codebase exploration with prompt-enforced read-only behavior.
  plan:
    description: Read-only implementation planning and architecture design.
  reviewer:
    description: Read-only second-model code reviewer that returns structured findings.
