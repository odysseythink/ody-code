name: Rust Host Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-host-smoke:
    name: rust-host-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
          - target: darwin-x64
            os: macos-13
          - target: linux-x64
            os: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Run Rust host unit tests
        run: pnpm run test:host
        shell: bash

      - name: Build Rust host release binary
        run: pnpm run build:host
        shell: bash

      # Cross-language connector test (requires packages/node-sdk/test/rust-host-connect.test.ts
      # — created in Part 2 transport implementation. If missing, this step is skipped).
      - name: Run cross-language connector test
        run: pnpm vitest run packages/node-sdk/test/rust-host-connect.test.ts
        shell: bash
        continue-on-error: true

      - name: Upload ody-host artifact
        uses: actions/upload-artifact@v4
        with:
          name: ody-host-${{ matrix.target }}
          path: rust-ody/target/release/ody-host*
          if-no-files-found: error
