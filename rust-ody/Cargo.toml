[package]
name = "ody-rust"
version = "0.1.0"
edition = "2021"
description = "PoC: hot-path logic in Rust compiled to Wasm for ody-code"
license = "MIT"

[lib]
# cdylib -> produces a standalone .wasm with no wasm-bindgen glue.
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
