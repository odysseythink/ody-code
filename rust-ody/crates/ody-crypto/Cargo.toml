[package]
name = "ody-crypto"
version = "0.1.0"
edition = "2021"
description = "Native crypto helpers for ody-code via napi-rs"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rsa = "0.9"

[build-dependencies]
napi-build = "2"
