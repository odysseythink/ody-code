[package]
name = "ody-host"
version = "0.1.0"
edition = "2021"
description = "Standalone Rust host for ody-code CoreAPI/SDKAPI prototype"
license = "MIT"

[[bin]]
name = "ody-host"
path = "src/main.rs"

[[bin]]
name = "tools-bench"
path = "src/bench/tools_bench.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
kaos-rs = { path = "../kaos-rs" }
kosong-rs = { path = "../kosong-rs" }
agent-rs = { path = "../agent-rs" }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
regex = "1"
dirs = "5"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
anyhow = "1"
tools-rs = { path = "../tools-rs" }
url = "2"
scraper = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }

[dev-dependencies]
tokio-test = "0.4"
httptest = "0.16"
tempfile = "3"
